<!DOCTYPE html>
<html>
<head>
<title>Shopping Cart</title>
</head>

<body style="margin:0;font-family:Arial;background:#f5f5f5;">

<div style="background:#00008B;color:white;padding:18px;font-size:28px;font-weight:bold;display:flex;justify-content:space-between;">

<span>Shopping Cart</span>

<a href="snuggle bug .HTML" style="color:white;text-decoration:none;background:red;padding:10px 18px;border-radius:6px;">Home</a>
<a href="SHOPNOW.HTML" style="color:white;text-decoration:none;background:red;padding:10px 18px;border-radius:6px;">SHOP</a>
</div>

<div id="cartItems" style="padding:20px;"></div>

<h2 id="total" style="padding:20px;color:green;"></h2>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let html="";

let total=0;

cart.forEach((item,index)=>{

total += item.price * item.quantity;

html += `

<div style="display:flex;align-items:center;background:white;margin-bottom:20px;padding:15px;border-radius:10px;">

<img src="${item.image}" style="width:120px;height:120px;object-fit:cover;border-radius:10px;">

<div style="margin-left:20px;flex:1;">

<h2>${item.name}</h2>

<h3 style="color:green;">R${item.price}</h3>

<p>Quantity: ${item.quantity}</p>

<button onclick="removeItem(${index})" style="background:red;color:white;border:none;padding:10px 15px;border-radius:5px;cursor:pointer;">
Remove
</button>

</div>

</div>

`;

});

document.getElementById("cartItems").innerHTML = html;

document.getElementById("total").innerHTML = "Total: R"+total;

function removeItem(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

location.reload();

}

</script>

<button onclick="window.location='payment page.html'"
style="width:100%;padding:15px;background:green;color:white;border:none;font-size:18px;border-radius:6px;cursor:pointer;">
Proceed to Checkout
</button>

</body>
</html>
