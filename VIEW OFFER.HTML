<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addOffer(name,price,image){

let product = cart.find(item=>item.name===name);

if(product){

product.quantity++;

}else{

cart.push({

name:name,

price:price,

image:image,

quantity:1

});

product = cart.find(item=>item.name===name);

}

if(product.quantity==3){

product.price = price*2;

product.offer="Buy 2 Get 1 Free";

alert("🎉 Congratulations!\n\nYour FREE "+name+" has been added.");

}else{

product.price = price*product.quantity;

}

localStorage.setItem("cart",JSON.stringify(cart));

alert(name+" added to cart.");

}

</script>
