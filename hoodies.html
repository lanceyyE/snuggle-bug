<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name,price,image){

let found = cart.find(item => item.name===name);

if(found){

found.quantity++;

}else{

cart.push({
name:name,
price:price,
image:image,
quantity:1
});

}

localStorage.setItem("cart",JSON.stringify(cart));

alert(name + " added to cart!");

}

</script>
