<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Checkout</title>
</head>

<body style="margin:0;font-family:Arial;background:#f5f5f5;">

<div style="background:#00008B;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center;">
<h1 style="margin:0;">Checkout</h1>

<div>
<a href="snuggle bug .HTML" style="color:white;text-decoration:none;background:#444;padding:10px 20px;border-radius:5px;margin-right:10px;">Home</a>

<a href="shopping cart.html" style="color:white;text-decoration:none;background:red;padding:10px 20px;border-radius:5px;">Cart</a>
</div>

</div>

<div style="width:90%;max-width:1200px;margin:30px auto;display:flex;gap:30px;flex-wrap:wrap;">

<!-- CUSTOMER DETAILS -->

<div style="flex:1;background:white;padding:25px;border-radius:10px;min-width:350px;">

<h2>Customer Information</h2>

<input id="fullname" type="text" placeholder="Full Name"
style="width:100%;padding:12px;margin-top:10px;border:1px solid #ccc;border-radius:5px;">

<input id="email" type="email" placeholder="Email Address"
style="width:100%;padding:12px;margin-top:15px;border:1px solid #ccc;border-radius:5px;">

<input id="phone" type="text" placeholder="Phone Number"
style="width:100%;padding:12px;margin-top:15px;border:1px solid #ccc;border-radius:5px;">

<textarea id="address"
placeholder="Delivery Address"
style="width:100%;height:120px;padding:12px;margin-top:15px;border:1px solid #ccc;border-radius:5px;"></textarea>

<h2 style="margin-top:30px;">Payment Method</h2>

<select id="payment"
style="width:100%;padding:12px;border:1px solid #ccc;border-radius:5px;">

<option>Credit / Debit Card</option>

<option>PayPal</option>

<option>Bank Transfer</option>

<option>Cash on Delivery</option>

</select>

</div>

<!-- ORDER SUMMARY -->

<div style="flex:1;background:white;padding:25px;border-radius:10px;min-width:350px;">

<h2>Order Summary</h2>

<div id="cartItems"></div>

<hr>

<h2 id="total"></h2>

<button onclick="placeOrder()"
style="width:100%;padding:15px;background:#008000;color:white;border:none;font-size:18px;border-radius:6px;cursor:pointer;margin-top:20px;">

Pay Now

</button>

</div>

</div>

<script>

let cart=JSON.parse(localStorage.getItem("cart"))||[];

let html="";

let total=0;

cart.forEach(item=>{

total+=item.price*item.quantity;

html+=`

<div style="display:flex;margin-bottom:20px;align-items:center;">

<img src="${item.image}"
style="width:90px;height:90px;object-fit:cover;border-radius:8px;">

<div style="margin-left:15px;">

<h3>${item.name}</h3>

<p>Quantity: ${item.quantity}</p>

<p style="color:green;">R${item.price}</p>

</div>

</div>

`;

});

document.getElementById("cartItems").innerHTML=html;

document.getElementById("total").innerHTML="Total: R"+total;

function placeOrder(){

let name=document.getElementById("fullname").value;

let email=document.getElementById("email").value;

let phone=document.getElementById("phone").value;

let address=document.getElementById("address").value;

if(name==""||email==""||phone==""||address==""){

alert("Please complete all customer information.");

return;

}

alert("Thank you "+name+"!\n\nYour order has been placed successfully.\n\nTotal Paid: R"+total);

localStorage.removeItem("cart");

window.location="index.html";

}

</script>
<div style="background-color: navy; color: white; text-align: center; padding: 10px 20px; font-size: 14px;">
  &copy; 2026 Snuggle Bug. All rights reserved.
</div>
</body>
</html>
